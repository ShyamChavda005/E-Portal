<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Login | Exam Portal</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">    
        <style>
            body{
                background: linear-gradient(135deg,#667eea,#764ba2);
                height:100vh;
                animation: gradientMove 12s ease infinite;
            }

            @keyframes gradientMove{
                0%{
                    background-position:0% 50%;
                }
                50%{
                    background-position:100% 50%;
                }
                100%{
                    background-position:0% 50%;
                }
            }

            .card{
                border:none;
                border-radius:18px;
                animation: zoomFade 1s ease;
            }

            @keyframes zoomFade{
                from{
                    opacity:0;
                    transform:scale(.8);
                }
                to{
                    opacity:1;
                    transform:scale(1);
                }
            }

            .form-control{
                border-radius:12px;
                transition:.3s;
            }

            .form-control:focus{
                box-shadow:0 0 12px rgba(102,126,234,.5);
                transform:scale(1.02);
            }

            .btn-custom{
                background:#667eea;
                border:none;
                border-radius:12px;
                transition:.3s;
            }

            .btn-custom:hover{
                background:#5a67d8;
                transform:translateY(-2px);
                box-shadow:0 10px 20px rgba(0,0,0,.25);
            }
        </style>
    </head>
    <body class="d-flex align-items-center justify-content-center">

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-4">

                    <div class="card shadow-lg p-4">

                        <h3 class="text-center mb-4 fw-bold">Exam Portal Login</h3>

                        <form action="loginServlet" method="post" novalidate>

                            <div class="mb-4">
                                <div id="msg"></div>

                                <label class="form-label fw-semibold mb-2">Select Role</label>

                                <div class="btn-group w-100" role="group">

                                    <input type="radio" class="btn-check" name="role" id="admin" value="admin" autocomplete="off" required>
                                    <label class="btn btn-outline-primary py-2" for="admin">
                                        <i class="fa-solid fa-user-shield me-2"></i> Admin
                                    </label>

                                    <input type="radio" class="btn-check" name="role" id="student" value="student" autocomplete="off">
                                    <label class="btn btn-outline-success py-2" for="student">
                                        <i class="fa-solid fa-user-graduate me-2"></i> Student
                                    </label>

                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="mb-2">Username</label>
                                <input type="text" class="form-control" name="username">
                            </div>

                            <div class="mb-3">
                                <label class="mb-2">Password</label>
                                <input type="password" class="form-control" name="password">
                            </div>

                            <button class="btn btn-custom w-100 text-white">
                                <i class="fa-solid fa-right-to-bracket"></i> Login
                            </button>

                            <div class="text-center mt-3">
                                New user? 
                                <a href="register.html" class="text-decoration-none fw-semibold">Register</a>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>

        <script>
            const p = new URLSearchParams(window.location.search);
            const msgBox = document.getElementById("msg");

            if (p.get("success"))
                msgBox.innerHTML = `<div class="alert alert-success text-center">Registration successful! Please login.</div>`;

            if (p.get("username"))
                msgBox.innerHTML = `<div class="alert alert-warning text-center">Incorrect Username!</div>`;

            if (p.get("password"))
                msgBox.innerHTML = `<div class="alert alert-warning text-center">Incorrect Password!</div>`;

            if (p.get("adusername"))
                msgBox.innerHTML = `<div class="alert alert-warning text-center">Invalid Admin Username!</div>`;

            if (p.get("adpassword"))
                msgBox.innerHTML = `<div class="alert alert-warning text-center">Invalid Admin Password!</div>`;

            if (p.get("ExitsUser"))
                msgBox.innerHTML = `<div class="alert alert-warning text-center">Username already exists</div>`;

            // Validation 

            const form = document.querySelector("form");
            const username = form.username;
            const password = form.password;
            const roles = document.querySelectorAll('input[name="role"]');

            function showError(input, msg) {
                input.classList.add("is-invalid");
                input.classList.remove("is-valid");

                let div = input.nextElementSibling;
                if (!div || !div.classList.contains("invalid-feedback")) {
                    div = document.createElement("div");
                    div.className = "invalid-feedback";
                    input.after(div);
                }
                div.innerText = msg;
            }

            function showSuccess(input) {
                input.classList.remove("is-invalid");
                input.classList.add("is-valid");

                let div = input.nextElementSibling;
                if (div && div.classList.contains("invalid-feedback"))
                    div.remove();
            }

            function validateRole() {
                for (let r of roles) {
                    if (r.checked) {
                        document.querySelector(".btn-group").classList.remove("border", "border-danger", "p-2", "rounded");
                        return true;
                    }
                }

                document.querySelector(".btn-group").classList.add("border", "border-danger", "p-2", "rounded");

                msgBox.innerHTML = `<div class="alert alert-danger text-center">
                            Please select role
                            </div>`;

                return false;
            }

            function validateUsername() {
                const r = /^[a-zA-Z0-9_]{4,12}$/;

                if (!r.test(username.value)) {
                    showError(username, "4-12 chars, letters/numbers/_ only");
                    return false;
                }
                showSuccess(username);
                return true;
            }

            function validatePassword() {
                const r = /^(?=.*[A-Z])(?=.*\d).{6,}$/;

                if (!r.test(password.value)) {
                    showError(password, "Min 6 chars + 1 number + 1 uppercase");
                    return false;
                }
                showSuccess(password);
                return true;
            }

            username.oninput = validateUsername;
            password.oninput = validatePassword;

            form.addEventListener("submit", function (e) {

                const valid =
                        validateRole() &&
                        validateUsername() &&
                        validatePassword();

                if (!valid)
                    e.preventDefault();

            });
        </script>

    </body>
</html>
