<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Register | Exam Portal</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

        <style>
            body{
                background: linear-gradient(135deg,#4facfe,#00f2fe);
                height:100vh;
                animation: gradientMove 10s ease infinite;
            }

            @keyframes gradientMove{
                0%{
                    background-position:0% 50%;
                }
                50%{
                    background-position:100% 50%;
                }
                100%{
                    background-position:0% 50%;
                }
            }

            .card{
                border:none;
                border-radius:18px;
                animation: fadeSlide 1s ease;
            }

            @keyframes fadeSlide{
                from{
                    opacity:0;
                    transform:translateY(40px);
                }
                to{
                    opacity:1;
                    transform:translateY(0);
                }
            }

            .form-control{
                border-radius:12px;
                transition:.3s;
            }

            .form-control:focus{
                box-shadow:0 0 10px rgba(0,123,255,.4);
                transform:scale(1.02);
            }

            .btn-custom{
                background:#4facfe;
                border:none;
                border-radius:12px;
                transition:.3s;
            }

            .btn-custom:hover{
                background:#00c6ff;
                transform:translateY(-2px);
                box-shadow:0 8px 20px rgba(0,0,0,.2);
            }
        </style>
    </head>

    <body class="d-flex align-items-center justify-content-center">

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">

                    <div class="card shadow-lg p-4">

                        <h3 class="text-center mb-4 fw-bold">Create Account</h3>

                        <form action="registerServlet" method="post" novalidate>

                            <div id="msg"></div>

                            <!-- NAME -->
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" name="name">
                            </div>

                            <!-- EMAIL -->
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" name="email">
                            </div>

                            <!-- USERNAME -->
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" name="username">
                            </div>

                            <!-- PASSWORD -->
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" name="password">
                            </div>

                            <!-- CONFIRM PASSWORD -->
                            <div class="mb-3">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" name="confirmPassword">
                            </div>

                            <button class="btn btn-custom w-100 text-white">
                                <i class="fa-solid fa-user-plus"></i> Register
                            </button>

                            <div class="text-center mt-3">
                                Already have account?
                                <a href="index.html" class="text-decoration-none fw-semibold">Login</a>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>


        <script>
            const form = document.querySelector("form");

            const nameField = form.name;
            const email = form.email;
            const username = form.username;
            const password = form.password;
            const confirmPassword = form.confirmPassword;

            function showError(input, msg) {
                input.classList.add("is-invalid");
                input.classList.remove("is-valid");

                let div = input.nextElementSibling;
                if (!div || !div.classList.contains("invalid-feedback")) {
                    div = document.createElement("div");
                    div.className = "invalid-feedback";
                    input.after(div);
                }
                div.innerText = msg;
            }

            function showSuccess(input) {
                input.classList.remove("is-invalid");
                input.classList.add("is-valid");

                let div = input.nextElementSibling;
                if (div && div.classList.contains("invalid-feedback"))
                    div.remove();
            }

            function validateName() {
                if (nameField.value.trim().length < 5) {
                    showError(nameField, "Name must be at least 5 characters");
                    return false;
                }
                showSuccess(nameField);
                return true;
            }

            function validateEmail() {
                const r = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!r.test(email.value)) {
                    showError(email, "Enter valid email");
                    return false;
                }
                showSuccess(email);
                return true;
            }

            function validateUsername() {
                const r = /^[a-zA-Z0-9_]{4,12}$/;
                if (!r.test(username.value)) {
                    showError(username, "4-12 chars, letters/numbers/_ only");
                    return false;
                }
                showSuccess(username);
                return true;
            }

            function validatePassword() {
                const r = /^(?=.*[A-Z])(?=.*\d).{6,}$/;
                if (!r.test(password.value)) {
                    showError(password, "Min 6 chars + 1 number + 1 uppercase");
                    return false;
                }
                showSuccess(password);
                return true;
            }

            function validateConfirm() {
                if (confirmPassword.value !== password.value) {
                    showError(confirmPassword, "Passwords do not match");
                    return false;
                }
                showSuccess(confirmPassword);
                return true;
            }

            nameField.oninput = validateName;
            email.oninput = validateEmail;
            username.oninput = validateUsername;
            password.oninput = validatePassword;
            confirmPassword.oninput = validateConfirm;

            form.addEventListener("submit", function (e) {

                const valid =
                        validateName() &
                        validateEmail() &
                        validateUsername() &
                        validatePassword() &
                        validateConfirm();

                if (!valid)
                    e.preventDefault();

            });


            const p = new URLSearchParams(window.location.search);

            if (p.get("ExitsUser")) {
                document.getElementById("msg").innerHTML =
                        `<div class="alert alert-warning text-center">
                        Username already exists
                        </div>`;
            }
        </script>

    </body>
</html>
